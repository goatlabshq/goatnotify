site_name: GoatNotify
site_description: A modern, type-safe, framework-agnostic notification system for Python.
repo_url: https://github.com/goatlabshq/goatnotify
site_url: https://goatlabshq.github.io/goatnotify/
repo_name: goatlabshq/goatnotify
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.sections
    - navigation.top
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >
        GoatNotify is a type-safe, async-first, framework-agnostic notification system for Python.
        A notification yields typed messages (Mailable, DatabaseMessage, WebhookMessage or your own)
        and the type of each message selects the channel that delivers it, with retries, hooks and
        structured results. The core depends only on the standard library; optional adapters cover
        Django (email backend, templates, ORM store, Django Tasks), FastAPI and Jinja2. Python 3.14
        or newer is required. Install with `pip install goatnotify` or
        `pip install "goatnotify[django]"` (also `[fastapi]`, `[jinja]`).
      sections:
        Getting started:
          - index.md
          - getting-started.md
        Guide:
          - notifications.md
          - notifiable.md
          - mailables.md
          - templates.md
          - channels.md
          - transports.md
          - retries.md
          - queues.md
        Extending:
          - custom-channels.md
          - custom-transports.md
        Integrations:
          - integrations/*.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Introduction: index.md
  - Getting started: getting-started.md
  - Guide:
      - Notifications: notifications.md
      - Notifiables: notifiable.md
      - Mailables: mailables.md
      - Templates: templates.md
      - Channels: channels.md
      - Transports: transports.md
      - Retries and failures: retries.md
      - Queues: queues.md
  - Extending:
      - Custom channels: custom-channels.md
      - Custom transports: custom-transports.md
  - Integrations:
      - Django: integrations/django.md
      - FastAPI: integrations/fastapi.md
