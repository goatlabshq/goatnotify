[project]
name = "goatnotify-django"
version = "0.2.0" # x-release-please-version
description = "Django integration for GoatNotify: email backend, templates, ORM store and Django Tasks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Louis Midson LAJEANTY", email = "midsonlajeanty@proton.me" }]
requires-python = ">=3.14"
keywords = ["notifications", "email", "smtp", "webhooks", "asyncio", "typed"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "goatnotify-core==0.2.0", # x-release-please-version
    "asgiref>=3.9.1",
    "django>=6.1",
]

[project.urls]
Homepage = "https://github.com/goatlabshq/goatnotify"
Documentation = "https://goatlabshq.github.io/goatnotify/"
Issues = "https://github.com/goatlabshq/goatnotify/issues"

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "goatnotify.django"

[tool.uv.sources]
goatnotify-core = { workspace = true }
