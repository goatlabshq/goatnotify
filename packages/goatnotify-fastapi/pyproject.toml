[project]
name = "goatnotify-fastapi"
version = "0.1.0" # x-release-please-version
description = "FastAPI integration for GoatNotify."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Louis Midson LAJEANTY", email = "midsonlajeanty@proton.me" }]
requires-python = ">=3.14"
keywords = ["notifications", "email", "smtp", "webhooks", "asyncio", "typed"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "goatnotify-core==0.1.0", # x-release-please-version
    "fastapi>=0.115",
]

[project.urls]
Homepage = "https://github.com/goatlabshq/goatnotify"
Documentation = "https://goatlabshq.github.io/goatnotify/"
Issues = "https://github.com/goatlabshq/goatnotify/issues"

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "goatnotify.fastapi"

[tool.uv.sources]
goatnotify-core = { workspace = true }
